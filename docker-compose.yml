version: "3.9"

services:
  dashboard:
    build: .
    container_name: adewi-dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    command: streamlit run app/streamlit_app.py --server.port=8501 --server.address=0.0.0.0

  api:
    build: .
    container_name: adewi-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    command: python -m adewi serve --host 0.0.0.0 --port 8000
