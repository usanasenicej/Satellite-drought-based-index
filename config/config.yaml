study:
  name: "Agricultural Drought Early-Warning Index (ADEWI) for Rwanda"
  country: Rwanda
  provinces:
    - Eastern
    - Southern
  start_date: "2018-01-01"
  end_date: "2024-12-31"
  temporal_resolution: "16D"  # aligned with MODIS MOD13Q1
  crs: "EPSG:4326"

paths:
  data_raw: data/raw
  data_processed: data/processed
  results: results
  figures: results/figures
  tables: results/tables
  maps: results/maps

variables:
  ndvi:
    dataset: MODIS/061/MOD13Q1
    band: NDVI
    scale: 0.0001
    unit: "unitless"
  evi:
    dataset: MODIS/061/MOD13Q1
    band: EVI
    scale: 0.0001
    unit: "unitless"
  rainfall:
    dataset: UCSB-CHG/CHIRPS/PENTAD
    band: precipitation
    unit: "mm"
  soil_moisture:
    dataset: NASA/FLDAS/NOAH01/C/GL/M/V001
    band: SoilMoi00_10cm_tavg
    unit: "m3/m3"
  lst:
    dataset: MODIS/061/MOD11A2
    band: LST_Day_1km
    scale: 0.02
    unit: "K"

# ADEWI is vegetation-independent so it can lead NDVI.
# Negative ADEWI = drier / hotter than normal (drought-favourable).
# Target lead time: 3–6 weeks ahead of NDVI drought onset (brief §2).
weights:
  adewi:
    rainfall: 0.40
    soil_moisture: 0.35
    lst: 0.25          # subtracted (high LST = drought)
  cadi:
    # Brief formula: 0.30·Z_NDVI + 0.30·Z_rain + 0.20·Z_SM − 0.20·Z_LST
    # EVI added at 0.15 weight; total ≈ 1.15 (unnormalised — consistent with literature).
    ndvi: 0.30
    evi: 0.15
    rainfall: 0.30
    soil_moisture: 0.20
    lst: 0.20          # subtracted

drought:
  # Standardized anomaly thresholds matching the research brief:
  #   Normal  ≥ −0.5
  #   Mild    −0.5 to −1.0
  #   Moderate −1.0 to −1.5
  #   Severe  −1.5 to −2.0
  #   Extreme < −2.0
  classes:
    Mild: -0.5
    Moderate: -1.0
    Severe: -1.5
    Extreme: -2.0
  ndvi_event_threshold: -1.0
  adewi_event_threshold: -1.0
  min_event_steps: 2          # consecutive 16-day composites
  max_gap_steps: 1

validation:
  # Note: 2016-17 period pre-dates study window (2018-2024) — included for
  # contextual reference; in_study_window will be False in output tables.
  known_drought_periods:
    - {label: "2016-17 Eastern drought", start: "2016-09-01", end: "2017-03-31"}
    - {label: "2022 Season A dry spell", start: "2021-10-01", end: "2022-02-28"}
    - {label: "2023 Eastern dry conditions", start: "2023-01-01", end: "2023-04-30"}
    - {label: "2020 Short dry spell", start: "2020-01-15", end: "2020-03-10"}
    - {label: "2018 Mid-season dry period", start: "2018-06-15", end: "2018-08-31"}
  crop_stats_file: data/raw/nisr_crop_production_placeholder.csv
  crop_types: [maize, beans]   # primary food crops in Eastern/Southern Rwanda

synthetic:
  enabled: true
  seed: 42
  n_lat: 24
  n_lon: 28
  # Target mean ADEWI lead (weeks) baked into the generator so the
  # pipeline can be demonstrated before real GEE/DE Africa exports exist.
  typical_lead_composites: 3   # 3 x 16-day ≈ 6 weeks
