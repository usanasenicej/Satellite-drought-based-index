[project]
name = "adewi-rwanda"
version = "0.2.0"
description = "Satellite-based Agricultural Drought Early-Warning Index for Rwanda"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "ADEWI-Rwanda Research Contributors"}
]
keywords = [
  "remote-sensing",
  "drought-monitoring",
  "early-warning-system",
  "climate-analytics",
  "rwanda",
  "agriculture"
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "seaborn>=0.12",
  "pyyaml>=6.0",
  "openpyxl>=3.1",
  "streamlit>=1.28",
  "plotly>=5.18",
]

[project.scripts]
adewi = "adewi.run_pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
]
geo = [
  "xarray>=2023.1",
  "rioxarray>=0.14",
  "geopandas>=0.14",
  "rasterio>=1.3",
  "earthengine-api>=0.1.370",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
